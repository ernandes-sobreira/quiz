<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Curso QGIS · PRE-KNOWN-METER + apresentação</title>
<meta name="theme-color" content="#071014">
<style>
:root{--bg:#071014;--text:#f7f9f5;--muted:#aebcc1;--green:#7ed957;--line:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#deck{height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;scroll-behavior:smooth}.slide{height:100vh;width:100%;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 85% 12%,rgba(126,217,87,.10),transparent 28%),var(--bg)}
.inner{width:min(1500px,90vw);margin:auto}.k{color:var(--green);font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:.9rem;margin-bottom:18px}.hero{font-size:clamp(4rem,9vw,9rem);line-height:.9;letter-spacing:-.065em;font-weight:950;margin:0}.hero span{color:var(--green)}.sub{font-size:clamp(1rem,1.7vw,1.5rem);line-height:1.45;color:var(--muted);max-width:900px}.chips{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.chip{border:1px solid var(--line);border-radius:999px;padding:12px 17px;background:rgba(255,255,255,.045);font-weight:800}
.pkm{padding:2vh}.shell{width:100%;height:96vh;border:1px solid rgba(126,217,87,.22);border-radius:28px;overflow:hidden;background:#071014;box-shadow:0 30px 90px rgba(0,0,0,.4);display:flex;flex-direction:column}.shellTop{height:72px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#0b191e;border-bottom:1px solid var(--line)}.brand{font-weight:950;font-size:1.4rem;letter-spacing:-.03em}.brand span{color:var(--green)}.hint{color:var(--muted);font-size:.9rem;font-weight:750}.frame{flex:1;width:100%;border:0;background:#071014}
#courseFrame{width:100%;height:100%;border:0;background:#071014}.nav{position:fixed;z-index:100;right:18px;bottom:18px;display:flex;gap:8px}.nav button,.skip{border:1px solid var(--line);background:rgba(5,12,15,.86);backdrop-filter:blur(10px);color:#fff;border-radius:14px;padding:11px 14px;font-weight:850;cursor:pointer}.nav button:hover,.skip:hover{border-color:rgba(126,217,87,.7)}#counter{min-width:70px}.skip{position:absolute;left:24px;bottom:22px;z-index:5}.progress{position:fixed;z-index:101;left:0;top:0;height:4px;background:var(--green);width:33.333%;transition:.2s}
@media(max-width:800px){.shellTop{height:62px;padding:0 14px}.hint{display:none}.brand{font-size:1.05rem}.pkm{padding:1vh}.shell{height:98vh;border-radius:18px}.inner{width:88vw}}
</style>
</head>
<body>
<div id="progress" class="progress"></div>
<div id="deck">
  <section class="slide pkm" data-index="0">
    <div class="shell">
      <div class="shellTop"><div class="brand">PRE-<span>KNOWN</span>-METER</div><div class="hint">abertura interativa · curso de QGIS</div></div>
      <iframe class="frame" src="https://ernandes-sobreira.github.io/quiz/pre-known-meter/" title="PRE-KNOWN-METER" allow="clipboard-write; geolocation"></iframe>
    </div>
    <button class="skip" onclick="go(1)">TERMINAR INTERAÇÃO →</button>
  </section>

  <section class="slide" data-index="1">
    <div class="inner">
      <div class="k">AGORA EU SEI QUEM ESTÁ AQUI</div>
      <div class="hero">Vamos transformar<br>perguntas em <span>mapas.</span></div>
      <p class="sub">Do que a turma já sabe para o que o território pode revelar.</p>
      <div class="chips"><div class="chip">observar</div><div class="chip">localizar</div><div class="chip">comparar</div><div class="chip">medir</div><div class="chip">analisar</div></div>
    </div>
  </section>

  <section class="slide" data-index="2">
    <iframe id="courseFrame" src="./index.html" title="Curso introdutório de QGIS"></iframe>
  </section>
</div>
<div class="nav"><button onclick="go(-1)">←</button><button id="counter">1 / 3</button><button onclick="go(1)">→</button></div>
<script>
const deck=document.getElementById('deck');const slides=[...document.querySelectorAll('.slide')];let idx=0;
function current(){const y=deck.scrollTop+deck.clientHeight/2;let b=0,d=Infinity;slides.forEach((s,i)=>{const x=Math.abs(s.offsetTop+s.offsetHeight/2-y);if(x<d){d=x;b=i}});return b}
function update(){idx=current();counter.textContent=(idx+1)+' / '+slides.length;progress.style.width=((idx+1)/slides.length*100)+'%';if(idx===2)openCourseOnly()}
function go(delta){idx=Math.max(0,Math.min(slides.length-1,current()+delta));slides[idx].scrollIntoView({behavior:'smooth'});setTimeout(update,350)}
function openCourseOnly(){const f=document.getElementById('courseFrame');try{const w=f.contentWindow;if(typeof w.course==='function')w.course()}catch(e){}}
courseFrame.addEventListener('load',()=>{if(current()===2)setTimeout(openCourseOnly,250)});
deck.addEventListener('scroll',()=>{clearTimeout(window._s);window._s=setTimeout(update,90)});
document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown'].includes(e.key)){e.preventDefault();go(1)}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(-1)}else if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}});
update();
</script>
</body>
</html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071014"><title>Curso QGIS + PRE-KNOWN-METER</title><style>html,body{margin:0;min-height:100%;background:#071014;color:#fff;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}#boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:30px}.logo{font-size:clamp(2rem,6vw,5rem);font-weight:950;letter-spacing:-.05em}.logo span{color:#7ed957}.sub{color:#9eafb6;margin-top:12px}</style></head><body><div id="boot"><div><div class="logo">QGIS + PRE-<span>KNOWN</span>-METER</div><div class="sub">carregando a aula completa…</div></div></div><script>(async()=>{try{const parts=await Promise.all([0,1,2,3].map(i=>fetch(`app/c${i}.txt?v=20260922`).then(r=>{if(!r.ok)throw new Error('Falha ao carregar bloco '+i);return r.text()})));const b64=parts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><div class="logo">Não carregou.</div><div class="sub">'+String(e)+'</div></div>'}})();</script></body></html>

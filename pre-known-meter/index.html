<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071014"><title>PRE-KNOWN METER V2 · Ernandes</title></head><body style="margin:0;background:#071014;color:#fff;font-family:Inter,system-ui,sans-serif"><div id="boot" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><div style="font-size:3rem;font-weight:900">PRE-<span style="color:#81e15b">KNOWN</span>-METER</div><p style="color:#9eafb6">carregando V2…</p></div></div><script>(async()=>{try{const v='20260922-v2';const parts=await Promise.all([0,1,2,3].map(i=>fetch(`app/v2p${i}.txt?v=${v}`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('payload '+i);return r.text()})));const b=parts.join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Seu navegador precisa ser atualizado para abrir esta versão.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div style="max-width:680px;padding:30px"><h2>PRE-KNOWN METER</h2><p>Não consegui carregar a aplicação.</p><pre style="white-space:pre-wrap;color:#ff9ca2">'+String(e)+'</pre><button onclick="location.reload()" style="padding:12px 18px;border:0;border-radius:12px;background:#81e15b;font-weight:800">TENTAR NOVAMENTE</button></div>'}})();</script></body></html>

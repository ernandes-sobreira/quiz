<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071014"><title>PRE-KNOWN METER · Ernandes</title></head><body style="margin:0;background:#071014;color:#fff;font-family:Inter,system-ui,sans-serif"><div id="boot" style="min-height:100vh;display:grid;place-items:center;text-align:center"><div><div style="font-size:3rem;font-weight:900">PRE-<span style="color:#81e15b">KNOWN</span>-METER</div><p style="color:#9eafb6">carregando…</p></div></div><script>(async()=>{try{const parts=await Promise.all([0,1,2,3].map(i=>fetch(`app/p${i}.txt`).then(r=>{if(!r.ok)throw new Error('payload '+i);return r.text()})));const b=parts.join('');const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div><h2>PRE-KNOWN METER</h2><p>Não consegui carregar o aplicativo.</p><pre>'+e+'</pre></div>'}})();</script></body></html>
